<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xào tin nhắn</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar"></header>

<main class="wrap">

  <!-- ============ BỘ LỌC ============ -->
  <div class="card filters">
    <div class="frow">
      <span class="flabel">Khách nhắn trong</span>
      <div class="chips" id="rangeChips">
        <button class="chip" data-h="1">1 giờ</button>
        <button class="chip" data-h="3">3 giờ</button>
        <button class="chip" data-h="6">6 giờ</button>
        <button class="chip" data-h="12">12 giờ</button>
        <button class="chip on" data-h="24">24 giờ</button>
      </div>
      <span class="info" title="Facebook chỉ cho Page nhắn khách trong 24 giờ, tính từ tin nhắn cuối cùng của KHÁCH. Quá 24 giờ thì không gửi được.">?</span>
    </div>
  </div>

  <div class="grid-2">

    <!-- ============ DANH SÁCH KHÁCH ============ -->
    <section class="card">
      <div class="list-head">
        <p class="summary" id="summary">Đang tải…</p>
      </div>
      <div class="list-head rules">
        <label class="chk" title="Khách đã tự gửi số điện thoại thường là đã chốt đơn. Số do shop gửi (số tư vấn) không tính.">
          <input type="checkbox" id="skipPhone" checked />
          <span>Không nhắn khách đã gửi SĐT</span>
        </label>
        <label class="chk" title="Người đã được nhắn sau tin cuối của họ thì không nhắn nữa, cho tới khi họ nhắn tiếp">
          <input type="checkbox" id="skipSent" />
          <span>Không nhắn lại người đã nhắn rồi <span class="muted">(cho tới khi họ nhắn tiếp)</span></span>
        </label>
      </div>
      <div class="list-head tabs-row">
        <div class="chips" id="listTabs">
          <button class="chip on" data-tab="send">📨 Sẽ nhắn <b id="cntSend">0</b></button>
          <button class="chip" data-tab="skip">🚫 Không nhắn <b id="cntSkip">0</b></button>
        </div>
      </div>
      <div class="list-head">
        <input type="search" class="search" id="search" placeholder="Tìm theo tên hoặc nội dung…" />
        <button class="btn sm" id="btnAll">Chọn hết</button>
        <button class="btn sm ghost" id="btnNone">Bỏ chọn</button>
        <button class="btn sm ghost" id="btnReload" title="Tải lại">↻</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <!-- ============ XÀO TIN ============ -->
    <aside class="card sticky composer-col">
      <div class="card-head">
        <h2 class="card-title">🔀 Xào tin nhắn</h2>
      </div>

      <div class="composer">
        <div class="tpl-row">
          <select id="tplSelect"><option value="">📋 Chọn câu mẫu…</option></select>
          <button class="btn sm" id="btnSaveTpl" title="Lưu nội dung đang viết thành câu mẫu">💾 Lưu</button>
          <button class="btn sm ghost danger" id="btnDelTpl" title="Xoá câu mẫu đang chọn">🗑</button>
        </div>

        <textarea id="message" rows="5" placeholder="{Dạ chào|Em chào|Chào} {{first_name}} {ạ|nha}, shop {vừa về|mới có} {mẫu mới|hàng mới} nè!"></textarea>

        <div class="vars">
          Chèn:
          <button class="var-btn" data-var="{{first_name}}">Tên gọi</button>
          <button class="var-btn" data-var="{{name}}">Họ tên</button>
          <button class="var-btn spin-btn" id="btnChoice" title="Bôi đen một từ rồi bấm để thêm cách nói khác cho từ đó">🔀 Thêm lựa chọn</button>
          <button class="var-btn" id="btnExample" title="Điền một câu ví dụ">💡 Ví dụ</button>
        </div>

        <p class="note" id="spinInfo"></p>

        <div class="preview">
          <div class="preview-head">
            <span class="preview-label" id="previewLabel">Khách sẽ nhận (ví dụ):</span>
            <button class="btn xs" id="btnReshuffle">🔀 Xào lại</button>
          </div>
          <div class="bubbles" id="preview"></div>
        </div>

        <div class="send-dock">
          <button id="btnSend" class="btn primary big" disabled>Gửi cho <span id="sendCount">0</span> người</button>
        </div>

        <div class="progress-wrap">
          <div class="bar" id="bar" hidden><div></div></div>
          <p class="progress" id="stats"></p>
          <div class="log" id="log"></div>
        </div>
      </div>

      <details class="settings">
        <summary>⚙ Cài đặt gửi</summary>
        <div class="settings-body">
          <div class="setting">
            <span class="slabel">Nghỉ giữa mỗi tin</span>
            <div class="setting-row">
              <input type="number" id="delaySec" value="2" min="0" step="0.5" /> <span class="tip">giây — nghỉ lâu hơn thì trông tự nhiên hơn</span>
            </div>
          </div>
          <div class="setting-row"><button class="btn sm" id="btnResetLog">Xoá lịch sử đã gửi</button></div>
        </div>
      </details>
    </aside>
  </div>
</main>

<script src="common.js"></script>
<script src="spin.js"></script>
<script src="app.js"></script>
</body>
</html>
